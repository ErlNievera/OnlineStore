openapi: 3.0.3

info:
  title: Payment Service API
  description: API for managing payments in the online store
  version: 1.0.0

servers:
  - url: http://localhost:5120
    description: Development server

tags:
  - name: Payments
    description: Payment management operations

paths:

  /payments/v1/payments:

    get:
      tags:
        - Payments
      operationId: getPayments
      summary: Get all payments

      responses:
        '200':
          description: Payments retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentResponse'


    post:
      tags:
        - Payments
      operationId: createPayment
      summary: Create a new payment

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'

      responses:
        '201':
          description: Payment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'

        '400':
          $ref: '#/components/responses/BadRequest'

  /payments/v1/payments/{id}:

    parameters:
      - name: id
        in: path
        required: true
        description: Payment ID
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Payments
      operationId: getPaymentById
      summary: Get a payment by ID

      responses:
        '200':
          description: Payment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'

        '404':
          $ref: '#/components/responses/NotFound'


    put:
      tags:
        - Payments
      operationId: updatePayment
      summary: Update a payment

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentRequest'

      responses:
        '200':
          description: Payment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'

        '404':
          $ref: '#/components/responses/NotFound'

        '400':
          $ref: '#/components/responses/BadRequest'


    delete:
      tags:
        - Payments
      operationId: deletePayment
      summary: Delete a payment

      responses:
        '204':
          description: Payment deleted successfully

        '404':
          $ref: '#/components/responses/NotFound'


components:

  schemas:

    PaymentResponse:
      type: object
      required:
        - id
        - orderId
        - amount
        - status
        - paymentMethod
        - createdAt
        - updatedAt

      properties:

        id:
          type: string
          format: uuid
          description: Payment ID
          example: 7e5a5f1b-0b91-4a4e-8f6e-8f5d4f5a7e31

        orderId:
          type: string
          format: uuid
          description: ID of the associated order
          example: 5d8b2f31-8d4d-4f5d-9a2b-123456789abc

        amount:
          type: number
          format: double
          description: Payment amount
          example: 1599.98

        status:
          type: string
          description: Current payment status
          example: Pending

        paymentMethod:
          type: string
          description: Payment method used
          example: GCash

        createdAt:
          type: string
          format: date-time
          description: When the payment was created

        updatedAt:
          type: string
          format: date-time
          description: When the payment was last updated


    CreatePaymentRequest:
      type: object
      required:
        - orderId
        - amount
        - paymentMethod

      properties:

        orderId:
          type: string
          format: uuid
          description: ID of the order being paid
          example: 5d8b2f31-8d4d-4f5d-9a2b-123456789abc

        amount:
          type: number
          format: double
          minimum: 0.01
          description: Payment amount
          example: 1599.98

        paymentMethod:
          type: string
          description: Payment method
          example: GCash


    UpdatePaymentRequest:
      type: object
      required:
        - amount
        - status
        - paymentMethod

      properties:

        amount:
          type: number
          format: double
          minimum: 0.01
          description: Updated payment amount
          example: 1599.98

        status:
          type: string
          description: Updated payment status
          example: Completed

        paymentMethod:
          type: string
          description: Updated payment method
          example: GCash


    ProblemDetails:
      type: object
      properties:

        type:
          type: string
          nullable: true
          description: A URI reference to the problem type

        title:
          type: string
          nullable: true
          description: A short description of the problem

        status:
          type: integer
          nullable: true
          description: HTTP status code

        detail:
          type: string
          nullable: true
          description: Detailed explanation of the problem

        instance:
          type: string
          nullable: true
          description: URI identifying the specific occurrence


  responses:

    BadRequest:
      description: The request was invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    NotFound:
      description: The requested payment was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

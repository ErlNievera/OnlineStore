openapi: 3.0.3

info:
  title: Inventory Service API
  description: API for managing product inventory in the online store
  version: 1.0.0

servers:
  - url: http://localhost:5214

tags:
  - name: Inventory
    description: Inventory management operations

paths:

  /inventory/v1/items:

    get:
      tags:
        - Inventory
      operationId: getInventoryItems
      summary: Get all inventory items

      responses:
        '200':
          description: Inventory items retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryItemResponse'


    post:
      tags:
        - Inventory
      operationId: createInventoryItem
      summary: Create an inventory item

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventoryItemRequest'

      responses:
        '201':
          description: Inventory item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemResponse'

        '400':
          $ref: '#/components/responses/BadRequest'


  /inventory/v1/items/{id}:

    parameters:
      - name: id
        in: path
        required: true
        description: Inventory item ID
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Inventory
      operationId: getInventoryItemById
      summary: Get an inventory item by ID

      responses:
        '200':
          description: Inventory item found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemResponse'

        '404':
          $ref: '#/components/responses/NotFound'


    put:
      tags:
        - Inventory
      operationId: updateInventoryItem
      summary: Update an inventory item

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInventoryItemRequest'

      responses:
        '200':
          description: Inventory item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemResponse'

        '400':
          $ref: '#/components/responses/BadRequest'

        '404':
          $ref: '#/components/responses/NotFound'


    delete:
      tags:
        - Inventory
      operationId: deleteInventoryItem
      summary: Delete an inventory item

      responses:
        '204':
          description: Inventory item deleted

        '404':
          $ref: '#/components/responses/NotFound'


  /inventory/v1/items/{id}/reserve:

    parameters:
      - name: id
        in: path
        required: true
        description: Inventory item ID
        schema:
          type: string
          format: uuid

    post:
      tags:
        - Inventory
      operationId: reserveInventory
      summary: Reserve inventory stock

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveInventoryRequest'

      responses:
        '200':
          description: Inventory successfully reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemResponse'

        '400':
          $ref: '#/components/responses/BadRequest'

        '404':
          $ref: '#/components/responses/NotFound'


  /inventory/v1/items/{id}/release:

    parameters:
      - name: id
        in: path
        required: true
        description: Inventory item ID
        schema:
          type: string
          format: uuid

    post:
      tags:
        - Inventory
      operationId: releaseInventory
      summary: Release reserved inventory stock

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseInventoryRequest'

      responses:
        '200':
          description: Reserved inventory successfully released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItemResponse'

        '400':
          $ref: '#/components/responses/BadRequest'

        '404':
          $ref: '#/components/responses/NotFound'


components:

  schemas:

    InventoryItemResponse:
      type: object
      required:
        - id
        - productId
        - quantity
        - reservedQuantity
        - availableQuantity
        - createdAt
        - updatedAt

      properties:

        id:
          type: string
          format: uuid
          description: Inventory item ID
          example: 1834a689-8ab9-4a53-b605-d9b02140e1b2

        productId:
          type: string
          format: uuid
          description: Product ID
          example: 995128a7-1eb3-491d-9a52-124affd4a451

        quantity:
          type: integer
          format: int32
          minimum: 0
          description: Total inventory quantity
          example: 100

        reservedQuantity:
          type: integer
          format: int32
          minimum: 0
          description: Quantity currently reserved
          example: 10

        availableQuantity:
          type: integer
          format: int32
          minimum: 0
          description: Quantity available for purchase
          example: 90

        createdAt:
          type: string
          format: date-time
          description: When the inventory item was created

        updatedAt:
          type: string
          format: date-time
          description: When the inventory item was last updated


    CreateInventoryItemRequest:
      type: object
      required:
        - productId
        - quantity

      properties:

        productId:
          type: string
          format: uuid
          description: Product ID

        quantity:
          type: integer
          format: int32
          minimum: 0
          description: Initial inventory quantity


    UpdateInventoryItemRequest:
      type: object
      required:
        - quantity
        - reservedQuantity

      properties:

        quantity:
          type: integer
          format: int32
          minimum: 0
          description: Total inventory quantity

        reservedQuantity:
          type: integer
          format: int32
          minimum: 0
          description: Currently reserved quantity


    ReserveInventoryRequest:
      type: object
      required:
        - quantity

      properties:

        quantity:
          type: integer
          format: int32
          minimum: 1
          description: Quantity to reserve


    ReleaseInventoryRequest:
      type: object
      required:
        - quantity

      properties:

        quantity:
          type: integer
          format: int32
          minimum: 1
          description: Quantity to release


    ProblemDetails:
      type: object

      properties:

        type:
          type: string
          nullable: true

        title:
          type: string
          nullable: true

        status:
          type: integer
          nullable: true

        detail:
          type: string
          nullable: true

        instance:
          type: string
          nullable: true


  responses:

    BadRequest:
      description: The request was invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'


    NotFound:
      description: The requested inventory item was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

openapi: 3.0.3

info:
  title: Order Service API
  description: API for managing customer orders in the online store
  version: 1.0.0

servers:
  - url: http://localhost:5202

tags:
  - name: Orders
    description: Order management operations

paths:

  /orders/v1/orders:

    get:
      tags:
        - Orders
      operationId: getOrders
      summary: Get all orders

      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'

    post:
      tags:
        - Orders
      operationId: createOrder
      summary: Create a new order

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'

      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

        '400':
          $ref: '#/components/responses/BadRequest'

        '404':
          $ref: '#/components/responses/NotFound'


  /orders/v1/orders/{id}:

    parameters:
      - name: id
        in: path
        required: true
        description: Order ID
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Orders
      operationId: getOrderById
      summary: Get an order by ID

      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

        '404':
          $ref: '#/components/responses/NotFound'


    put:
      tags:
        - Orders
      operationId: updateOrder
      summary: Update an existing order

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'

      responses:
        '200':
          description: Order updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

        '400':
          $ref: '#/components/responses/BadRequest'

        '404':
          $ref: '#/components/responses/NotFound'


    delete:
      tags:
        - Orders
      operationId: deleteOrder
      summary: Delete an order

      responses:
        '204':
          description: Order deleted successfully

        '404':
          $ref: '#/components/responses/NotFound'


components:

  schemas:

    OrderResponse:
      type: object
      required:
        - id
        - productId
        - customerName
        - customerEmail
        - totalAmount
        - status
        - createdAt
        - updatedAt

      properties:

        id:
          type: string
          format: uuid
          description: Order ID
          example: 7e5a5f1b-0b91-4a4e-8f6e-8f5d4f5a7e31

        productId:
          type: string
          format: uuid
          description: ID of the ordered product
          example: 995128a7-1eb3-491d-9a52-124affd4a451

        customerName:
          type: string
          description: Customer name
          example: Juan Dela Cruz

        customerEmail:
          type: string
          format: email
          description: Customer email address
          example: juan@example.com

        totalAmount:
          type: number
          format: double
          description: Total order amount
          example: 1599.98

        status:
          type: string
          description: Current order status
          example: Pending

        createdAt:
          type: string
          format: date-time
          description: When the order was created

        updatedAt:
          type: string
          format: date-time
          description: When the order was last updated


    CreateOrderRequest:
      type: object
      required:
        - productId
        - customerName
        - customerEmail
        - quantity

      properties:

        productId:
          type: string
          format: uuid
          description: ID of the product being ordered
          example: 995128a7-1eb3-491d-9a52-124affd4a451

        customerName:
          type: string
          description: Customer name
          example: Juan Dela Cruz

        customerEmail:
          type: string
          format: email
          description: Customer email address
          example: juan@example.com

        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Number of products to order
          example: 2


    UpdateOrderRequest:
      type: object
      required:
        - customerName
        - customerEmail
        - productId
        - totalAmount
        - status

      properties:

        customerName:
          type: string
          description: Customer name
          example: Juan Dela Cruz

        customerEmail:
          type: string
          format: email
          description: Customer email address
          example: juan@example.com

        productId:
          type: string
          format: uuid
          description: ID of the product associated with the order
          example: 995128a7-1eb3-491d-9a52-124affd4a451

        totalAmount:
          type: number
          format: double
          description: Total order amount
          example: 1599.98

        status:
          type: string
          description: Current order status
          example: Confirmed


    ProblemDetails:
      type: object

      properties:

        type:
          type: string
          nullable: true

        title:
          type: string
          nullable: true

        status:
          type: integer
          nullable: true

        detail:
          type: string
          nullable: true

        instance:
          type: string
          nullable: true


  responses:

    BadRequest:
      description: The request was invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    NotFound:
      description: The requested order or product was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

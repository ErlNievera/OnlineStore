openapi: 3.0.3

info:
  title: Catalog Service API
  description: API for managing products in the online store catalog
  version: 1.0.0

servers:
  - url: http://localhost:5001

tags:
  - name: Products
    description: Product management operations

paths:

  /catalog/v1/products:

    get:
      tags:
        - Products
      operationId: getProducts
      summary: Get all products
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

    post:
      tags:
        - Products
      operationId: createProduct
      summary: Create a product

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'

      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '400':
          $ref: '#/components/responses/BadRequest'


  /catalog/v1/products/{id}:

    parameters:
      - name: id
        in: path
        required: true
        description: Product ID
        schema:
          type: integer
          format: int32

    get:
      tags:
        - Products
      operationId: getProductById
      summary: Get a product by ID

      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '404':
          $ref: '#/components/responses/NotFound'


    put:
      tags:
        - Products
      operationId: updateProduct
      summary: Update a product

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'

      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '400':
          $ref: '#/components/responses/BadRequest'

        '404':
          $ref: '#/components/responses/NotFound'


    delete:
      tags:
        - Products
      operationId: deleteProduct
      summary: Delete a product

      responses:
        '204':
          description: Product deleted

        '404':
          $ref: '#/components/responses/NotFound'


components:

  schemas:

    Product:
      type: object

      required:
        - id
        - name
        - description
        - price
        - isActive

      properties:

        id:
          type: integer
          format: int32
          example: 1

        name:
          type: string
          maxLength: 200
          example: Wireless Mouse

        description:
          type: string
          maxLength: 1000
          example: Ergonomic wireless mouse

        price:
          type: number
          format: double
          example: 799.99

        isActive:
          type: boolean
          example: true


    CreateProductRequest:
      type: object

      required:
        - name
        - description
        - price

      properties:

        name:
          type: string
          minLength: 1
          maxLength: 200

        description:
          type: string
          minLength: 1
          maxLength: 1000

        price:
          type: number
          format: double
          minimum: 0.01


    UpdateProductRequest:
      type: object

      required:
        - name
        - description
        - price
        - isActive

      properties:

        name:
          type: string
          minLength: 1
          maxLength: 200

        description:
          type: string
          minLength: 1
          maxLength: 1000

        price:
          type: number
          format: double
          minimum: 0.01

        isActive:
          type: boolean


    ProblemDetails:
      type: object

      properties:

        type:
          type: string
          nullable: true

        title:
          type: string
          nullable: true

        status:
          type: integer
          nullable: true

        detail:
          type: string
          nullable: true

        instance:
          type: string
          nullable: true


  responses:

    BadRequest:
      description: The request was invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'


    NotFound:
      description: The requested product was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
